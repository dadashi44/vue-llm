name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could vue-llm help?
      description: An API sketch is great if you have one in mind.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
